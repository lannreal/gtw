<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Video Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --nf-red: #e50914;
            --nf-red-hover: #b80710;
            --nf-white: #ffffff;
            --nf-gray: #808080;
            --nf-light-gray: #b3b3b3;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: var(--nf-white);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        #player-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }

        #player-wrapper.hide-cursor {
            cursor: none;
        }

        video {
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            background: #000;
        }

        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            background: #000;
        }

        /* Top & Bottom Shadow Gradients */
        .overlay-gradient-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 140px;
            background: linear-gradient(180deg, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.35) 60%, transparent 100%);
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.35s var(--ease-out);
        }

        .overlay-gradient-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 160px;
            background: linear-gradient(0deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.35s var(--ease-out);
        }

        /* Top Header Bar */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: max(24px, env(safe-area-inset-top)) 36px 12px 36px;
            display: flex;
            align-items: center;
            z-index: 20;
            transition: opacity 0.35s var(--ease-out), transform 0.35s var(--ease-out);
        }

        .movie-title {
            font-size: clamp(1.1rem, 2.8vw, 1.65rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        /* Center Big Action Ripple (Play / Pause / Seek) */
        .center-action {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 15;
            transition: transform 0.25s var(--ease-out), opacity 0.25s var(--ease-out);
        }

        .center-action.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.1);
        }

        /* Double-tap Seek Ripples for Mobile */
        .seek-ripple {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 40%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.08);
            opacity: 0;
            pointer-events: none;
            z-index: 14;
            transition: opacity 0.2s ease;
        }

        .seek-ripple.left {
            left: 0;
            border-top-right-radius: 50%;
            border-bottom-right-radius: 50%;
        }

        .seek-ripple.right {
            right: 0;
            border-top-left-radius: 50%;
            border-bottom-left-radius: 50%;
        }

        .seek-ripple.active {
            opacity: 1;
        }

        .seek-ripple-text {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            margin-top: 6px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        /* Bottom Controls Bar */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 0 36px max(24px, env(safe-area-inset-bottom)) 36px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
            transition: opacity 0.35s var(--ease-out), transform 0.35s var(--ease-out);
        }

        /* Netflix Scrub Bar */
        .scrub-container {
            position: relative;
            width: 100%;
            height: 24px;
            display: flex;
            align-items: center;
            cursor: pointer;
            touch-action: none;
        }

        .scrub-track {
            position: relative;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.28);
            border-radius: 4px;
            transition: height 0.15s ease;
        }

        .scrub-container:hover .scrub-track,
        .scrub-container.active .scrub-track {
            height: 6px;
        }

        .scrub-buffer {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0%;
            background: rgba(255, 255, 255, 0.45);
            border-radius: 4px;
            pointer-events: none;
        }

        .scrub-progress {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0%;
            background: var(--nf-red);
            border-radius: 4px;
            pointer-events: none;
        }

        .scrub-handle {
            position: absolute;
            top: 50%;
            left: 0%;
            transform: translate(-50%, -50%) scale(0);
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--nf-red);
            box-shadow: 0 0 8px rgba(229, 9, 20, 0.9);
            pointer-events: none;
            transition: transform 0.15s var(--ease-out);
        }

        .scrub-container:hover .scrub-handle,
        .scrub-container.active .scrub-handle {
            transform: translate(-50%, -50%) scale(1);
        }

        .scrub-tooltip {
            position: absolute;
            bottom: 28px;
            left: 0;
            transform: translateX(-50%);
            background: rgba(18, 18, 18, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: 600;
            color: #fff;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            white-space: nowrap;
        }

        .scrub-container:hover .scrub-tooltip {
            opacity: 1;
        }

        /* Controls Row */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, color 0.15s, background 0.15s;
            position: relative;
        }

        .ctrl-btn:hover {
            color: var(--nf-white);
            transform: scale(1.12);
        }

        .ctrl-btn:active {
            transform: scale(0.92);
        }

        .ctrl-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .play-btn svg {
            width: 28px;
            height: 28px;
        }

        /* Volume Slider */
        .volume-group {
            display: flex;
            align-items: center;
            position: relative;
        }

        .volume-slider-box {
            width: 0px;
            overflow: hidden;
            transition: width 0.25s var(--ease-out), margin 0.25s var(--ease-out);
            display: flex;
            align-items: center;
        }

        .volume-group:hover .volume-slider-box {
            width: 75px;
            margin-left: 6px;
        }

        .volume-slider {
            -webkit-appearance: none;
            width: 75px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }

        /* Time Display */
        .time-display {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--nf-light-gray);
            margin-left: 4px;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        /* Menus (Quality, Speed) */
        .menu-popup-container {
            position: relative;
        }

        .menu-popup {
            position: absolute;
            bottom: 48px;
            right: 0;
            background: rgba(18, 18, 18, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(20px);
            border-radius: 8px;
            padding: 6px 0;
            min-width: 150px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            z-index: 30;
            animation: popupFade 0.2s var(--ease-out);
        }

        @keyframes popupFade {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-popup.open {
            display: flex;
        }

        .menu-popup-title {
            padding: 6px 14px 6px 14px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--nf-gray);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 4px;
        }

        .menu-item {
            padding: 7px 14px;
            font-size: 0.82rem;
            font-weight: 500;
            color: #ccc;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.15s, color 0.15s;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .menu-item.active {
            color: var(--nf-red);
            font-weight: 700;
        }

        .menu-item.active::after {
            content: '✓';
            font-size: 0.85rem;
            color: var(--nf-red);
        }

        /* Auto-Hide UI */
        .controls-hidden .overlay-gradient-top,
        .controls-hidden .overlay-gradient-bottom,
        .controls-hidden .top-bar,
        .controls-hidden .bottom-bar {
            opacity: 0;
            pointer-events: none;
        }

        .controls-hidden .top-bar {
            transform: translateY(-20px);
        }

        .controls-hidden .bottom-bar {
            transform: translateY(20px);
        }

        /* Netflix Loading Spinner */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 25;
            pointer-events: none;
        }

        .nf-spinner {
            width: 56px;
            height: 56px;
            border: 4px solid rgba(229, 9, 20, 0.2);
            border-top: 4px solid var(--nf-red);
            border-radius: 50%;
            animation: nfSpin 0.9s linear infinite;
        }

        @keyframes nfSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 16px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #e5e5e5;
            letter-spacing: 0.02em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Error Modal */
        #errorModal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(18, 18, 18, 0.96);
            border: 1px solid rgba(229, 9, 20, 0.5);
            border-radius: 12px;
            padding: 28px 32px;
            max-width: 90vw;
            width: 380px;
            text-align: center;
            z-index: 30;
            display: none;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }

        .error-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--nf-red);
            margin-bottom: 8px;
        }

        .error-desc {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .modal-btn {
            background: var(--nf-red);
            color: #fff;
            border: none;
            padding: 9px 22px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .modal-btn:hover {
            background: var(--nf-red-hover);
            transform: scale(1.04);
        }

        /* ========================================== */
        /* RESPONSIVE MOBILE OPTIMIZATIONS            */
        /* ========================================== */
        @media (max-width: 768px) {
            .top-bar {
                padding: max(14px, env(safe-area-inset-top)) 16px 8px 16px;
            }
            .movie-title {
                font-size: clamp(0.95rem, 3.6vw, 1.25rem);
                max-width: 100%;
            }
            .bottom-bar {
                padding: 0 14px max(14px, env(safe-area-inset-bottom)) 14px;
                gap: 8px;
            }
            .scrub-container {
                height: 28px;
            }
            .scrub-handle {
                transform: translate(-50%, -50%) scale(1);
                width: 13px;
                height: 13px;
            }
            .volume-group {
                display: none;
            }
            .controls-left, .controls-right {
                gap: 6px;
            }
            .ctrl-btn {
                width: 36px;
                height: 36px;
                min-width: 36px;
            }
            .ctrl-btn svg {
                width: 20px;
                height: 20px;
            }
            .play-btn svg {
                width: 24px;
                height: 24px;
            }
            .time-display {
                font-size: 0.72rem;
                font-weight: 600;
                margin-left: 2px;
            }
            .menu-popup {
                position: fixed;
                bottom: max(64px, calc(env(safe-area-inset-bottom) + 52px));
                right: 14px;
                max-height: 52vh;
                overflow-y: auto;
            }
        }

        @media (max-width: 480px) {
            .controls-left {
                gap: 2px;
            }
            .controls-right {
                gap: 2px;
            }
            .ctrl-btn {
                width: 34px;
                height: 34px;
                min-width: 34px;
            }
            .time-display {
                font-size: 0.68rem;
            }
        }
    </style>
</head>
<body>
    <div id="player-wrapper">
        <!-- Video Element -->
        <video id="video" playsinline preload="auto"></video>

        <!-- Top & Bottom Gradient Shadows -->
        <div class="overlay-gradient-top"></div>
        <div class="overlay-gradient-bottom"></div>

        <!-- Top Header Bar -->
        <div class="top-bar">
            <div class="movie-title" id="movieTitle">Memuat Judul Film...</div>
        </div>

        <!-- Double-Tap Seek Ripples for Mobile -->
        <div class="seek-ripple left" id="seekRippleLeft">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/>
            </svg>
            <div class="seek-ripple-text">-10s</div>
        </div>
        <div class="seek-ripple right" id="seekRippleRight">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 17l5-5-5-5M6 17l5-5-5-5"/>
            </svg>
            <div class="seek-ripple-text">+10s</div>
        </div>

        <!-- Center Big Action Icons (Play / Pause Ripple) -->
        <div class="center-action" id="centerAction">
            <svg id="centerPlayIcon" viewBox="0 0 24 24" width="44" height="44" fill="currentColor">
                <polygon points="6 3 20 12 6 21 6 3"></polygon>
            </svg>
            <svg id="centerPauseIcon" viewBox="0 0 24 24" width="44" height="44" fill="currentColor" style="display:none;">
                <rect x="5" y="3" width="5" height="18" rx="1"></rect>
                <rect x="14" y="3" width="5" height="18" rx="1"></rect>
            </svg>
        </div>

        <!-- Bottom Controls Bar -->
        <div class="bottom-bar">
            <!-- Netflix Scrub Bar -->
            <div class="scrub-container" id="scrubContainer">
                <div class="scrub-tooltip" id="scrubTooltip">00:00</div>
                <div class="scrub-track">
                    <div class="scrub-buffer" id="scrubBuffer"></div>
                    <div class="scrub-progress" id="scrubProgress"></div>
                    <div class="scrub-handle" id="scrubHandle"></div>
                </div>
            </div>

            <!-- Controls Row -->
            <div class="controls-row">
                <!-- Left Controls -->
                <div class="controls-left">
                    <!-- Play / Pause -->
                    <button class="ctrl-btn play-btn" id="playBtn" title="Play / Pause (Space)">
                        <svg id="playIcon" viewBox="0 0 24 24">
                            <polygon points="6 3 20 12 6 21 6 3"></polygon>
                        </svg>
                        <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;">
                            <rect x="5" y="3" width="5" height="18" rx="1"></rect>
                            <rect x="14" y="3" width="5" height="18" rx="1"></rect>
                        </svg>
                    </button>

                    <!-- Rewind 10s -->
                    <button class="ctrl-btn" id="rewindBtn" title="Mundur 10 Detik (Left Arrow)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/>
                        </svg>
                    </button>

                    <!-- Forward 10s -->
                    <button class="ctrl-btn" id="forwardBtn" title="Maju 10 Detik (Right Arrow)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M13 17l5-5-5-5M6 17l5-5-5-5"/>
                        </svg>
                    </button>

                    <!-- Volume Group (Desktop Only) -->
                    <div class="volume-group">
                        <button class="ctrl-btn" id="volumeBtn" title="Mute / Unmute (M)">
                            <svg id="volumeHighIcon" viewBox="0 0 24 24">
                                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                            </svg>
                            <svg id="volumeMuteIcon" viewBox="0 0 24 24" style="display:none;">
                                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                            </svg>
                        </button>
                        <div class="volume-slider-box">
                            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
                        </div>
                    </div>

                    <!-- Time Display -->
                    <div class="time-display">
                        <span id="currentTime">00:00</span> / <span id="durationTime">00:00</span>
                    </div>
                </div>

                <!-- Right Controls -->
                <div class="controls-right">
                    <!-- Playback Speed -->
                    <div class="menu-popup-container">
                        <button class="ctrl-btn" id="speedMenuBtn" title="Kecepatan Putar">
                            <span id="speedLabel" style="font-size: 0.82rem; font-weight: 700;">1x</span>
                        </button>
                        <div class="menu-popup" id="speedPopup">
                            <div class="menu-popup-title">Kecepatan</div>
                            <div class="menu-item" data-speed="0.5">0.5x</div>
                            <div class="menu-item" data-speed="0.75">0.75x</div>
                            <div class="menu-item active" data-speed="1">Normal (1x)</div>
                            <div class="menu-item" data-speed="1.25">1.25x</div>
                            <div class="menu-item" data-speed="1.5">1.5x</div>
                            <div class="menu-item" data-speed="2">2x</div>
                        </div>
                    </div>

                    <!-- Quality Selector -->
                    <div class="menu-popup-container">
                        <button class="ctrl-btn" id="qualityMenuBtn" title="Kualitas Video">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                            </svg>
                        </button>
                        <div class="menu-popup" id="qualityPopup">
                            <div class="menu-popup-title">Resolusi Video</div>
                            <div id="qualityList">
                                <div class="menu-item active" data-level="-1">Auto (Optimal)</div>
                            </div>
                        </div>
                    </div>

                    <!-- Fullscreen -->
                    <button class="ctrl-btn" id="fullscreenBtn" title="Layar Penuh (F)">
                        <svg id="enterFullscreenIcon" viewBox="0 0 24 24">
                            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                        </svg>
                        <svg id="exitFullscreenIcon" viewBox="0 0 24 24" style="display: none;">
                            <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Netflix Loading Indicator -->
        <div id="loader">
            <div class="nf-spinner"></div>
            <div class="loader-text" id="loaderText">Menyiapkan Tayangan...</div>
        </div>

        <!-- Error Dialog -->
        <div id="errorModal">
            <div class="error-title">Gagal Memuat Tayangan</div>
            <div class="error-desc" id="errorModalDesc">Video tidak dapat diputar. Silakan muat ulang halaman.</div>
            <button class="modal-btn" id="retryBtn">Muat Ulang</button>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById('player-wrapper');
        const video = document.getElementById('video');
        const loader = document.getElementById('loader');
        const errorModal = document.getElementById('errorModal');
        const errorModalDesc = document.getElementById('errorModalDesc');
        const retryBtn = document.getElementById('retryBtn');

        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const rewindBtn = document.getElementById('rewindBtn');
        const forwardBtn = document.getElementById('forwardBtn');
        const volumeBtn = document.getElementById('volumeBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeHighIcon = document.getElementById('volumeHighIcon');
        const volumeMuteIcon = document.getElementById('volumeMuteIcon');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');

        const scrubContainer = document.getElementById('scrubContainer');
        const scrubProgress = document.getElementById('scrubProgress');
        const scrubBuffer = document.getElementById('scrubBuffer');
        const scrubHandle = document.getElementById('scrubHandle');
        const scrubTooltip = document.getElementById('scrubTooltip');

        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const enterFullscreenIcon = document.getElementById('enterFullscreenIcon');
        const exitFullscreenIcon = document.getElementById('exitFullscreenIcon');
        const movieTitle = document.getElementById('movieTitle');

        const qualityMenuBtn = document.getElementById('qualityMenuBtn');
        const qualityPopup = document.getElementById('qualityPopup');
        const qualityList = document.getElementById('qualityList');

        const speedMenuBtn = document.getElementById('speedMenuBtn');
        const speedPopup = document.getElementById('speedPopup');
        const speedLabel = document.getElementById('speedLabel');

        const centerAction = document.getElementById('centerAction');
        const centerPlayIcon = document.getElementById('centerPlayIcon');
        const centerPauseIcon = document.getElementById('centerPauseIcon');

        const seekRippleLeft = document.getElementById('seekRippleLeft');
        const seekRippleRight = document.getElementById('seekRippleRight');

        let hlsInstance = null;
        let isScrubbing = false;
        let controlsTimeout = null;
        let lastTapTime = 0;

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return '00:00';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) {
                return `${h}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            }
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function showCenterAction(isPlay) {
            if (isPlay) {
                centerPlayIcon.style.display = 'block';
                centerPauseIcon.style.display = 'none';
            } else {
                centerPlayIcon.style.display = 'none';
                centerPauseIcon.style.display = 'block';
            }
            centerAction.classList.add('active');
            setTimeout(() => centerAction.classList.remove('active'), 350);
        }

        function triggerSeekRipple(isForward) {
            const target = isForward ? seekRippleRight : seekRippleLeft;
            target.classList.add('active');
            setTimeout(() => target.classList.remove('active'), 400);
        }

        function togglePlay() {
            if (video.paused) {
                video.play().then(() => showCenterAction(true)).catch(() => {});
            } else {
                video.pause();
                showCenterAction(false);
            }
        }

        video.addEventListener('play', () => {
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
        });

        video.addEventListener('pause', () => {
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
        });

        playBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            togglePlay();
        });

        function showControls() {
            wrapper.classList.remove('controls-hidden', 'hide-cursor');
            clearTimeout(controlsTimeout);
            if (!video.paused) {
                controlsTimeout = setTimeout(() => {
                    if (!document.querySelector('.menu-popup.open')) {
                        wrapper.classList.add('controls-hidden', 'hide-cursor');
                    }
                }, 3200);
            }
        }

        function toggleControlsVisibility() {
            if (wrapper.classList.contains('controls-hidden')) {
                showControls();
            } else {
                clearTimeout(controlsTimeout);
                wrapper.classList.add('controls-hidden', 'hide-cursor');
            }
        }

        wrapper.addEventListener('mousemove', showControls);
        
        // Touch & Click handler on video screen
        video.addEventListener('click', (e) => {
            const now = Date.now();
            const rect = video.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            
            // Double-tap seek on mobile (< 300ms between taps)
            if (now - lastTapTime < 300) {
                if (clickX < rect.width * 0.35) {
                    // Left double tap -> -10s
                    video.currentTime = Math.max(0, video.currentTime - 10);
                    triggerSeekRipple(false);
                    showControls();
                } else if (clickX > rect.width * 0.65) {
                    // Right double tap -> +10s
                    video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
                    triggerSeekRipple(true);
                    showControls();
                } else {
                    togglePlay();
                }
            } else {
                toggleControlsVisibility();
            }
            lastTapTime = now;
        });

        video.addEventListener('dblclick', (e) => {
            e.preventDefault();
        });

        rewindBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            video.currentTime = Math.max(0, video.currentTime - 10);
            triggerSeekRipple(false);
            showControls();
        });

        forwardBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
            triggerSeekRipple(true);
            showControls();
        });

        function updateVolume(val) {
            video.volume = val;
            video.muted = (val === 0);
            volumeSlider.value = val;
            if (val === 0) {
                volumeHighIcon.style.display = 'none';
                volumeMuteIcon.style.display = 'block';
            } else {
                volumeHighIcon.style.display = 'block';
                volumeMuteIcon.style.display = 'none';
            }
        }

        volumeSlider.addEventListener('input', (e) => {
            updateVolume(parseFloat(e.target.value));
        });

        volumeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (video.muted || video.volume === 0) {
                updateVolume(1);
            } else {
                updateVolume(0);
            }
        });

        video.addEventListener('timeupdate', () => {
            if (!isScrubbing && video.duration) {
                const pct = (video.currentTime / video.duration) * 100;
                scrubProgress.style.width = `${pct}%`;
                scrubHandle.style.left = `${pct}%`;
                currentTimeEl.innerText = formatTime(video.currentTime);
                durationTimeEl.innerText = formatTime(video.duration);
            }
        });

        video.addEventListener('progress', () => {
            if (video.duration && video.buffered.length > 0) {
                const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                const pct = (bufferedEnd / video.duration) * 100;
                scrubBuffer.style.width = `${pct}%`;
            }
        });

        // Robust Touch & Mouse Scrubbing
        function getScrubPosition(clientX) {
            const rect = scrubContainer.getBoundingClientRect();
            const posX = Math.max(0, Math.min(clientX - rect.left, rect.width));
            const pct = posX / rect.width;
            return { pct, time: pct * (video.duration || 0), posX };
        }

        function handleScrubMove(clientX) {
            const { pct, time, posX } = getScrubPosition(clientX);
            scrubProgress.style.width = `${pct * 100}%`;
            scrubHandle.style.left = `${pct * 100}%`;
            scrubTooltip.style.left = `${posX}px`;
            scrubTooltip.innerText = formatTime(time);
            currentTimeEl.innerText = formatTime(time);
        }

        scrubContainer.addEventListener('mousemove', (e) => {
            const { time, posX } = getScrubPosition(e.clientX);
            scrubTooltip.style.left = `${posX}px`;
            scrubTooltip.innerText = formatTime(time);
        });

        scrubContainer.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            isScrubbing = true;
            scrubContainer.classList.add('active');
            handleScrubMove(e.clientX);
            const { time } = getScrubPosition(e.clientX);
            video.currentTime = time;

            const onMouseMove = (ev) => {
                handleScrubMove(ev.clientX);
            };

            const onMouseUp = (ev) => {
                isScrubbing = false;
                scrubContainer.classList.remove('active');
                const data = getScrubPosition(ev.clientX);
                video.currentTime = data.time;
                window.removeEventListener('mousemove', onMouseMove);
                window.removeEventListener('mouseup', onMouseUp);
            };

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
        });

        // Touch scrubbing for mobile devices
        scrubContainer.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            isScrubbing = true;
            scrubContainer.classList.add('active');
            const touch = e.touches[0];
            handleScrubMove(touch.clientX);
            const { time } = getScrubPosition(touch.clientX);
            video.currentTime = time;
        }, { passive: false });

        scrubContainer.addEventListener('touchmove', (e) => {
            if (!isScrubbing) return;
            e.stopPropagation();
            const touch = e.touches[0];
            handleScrubMove(touch.clientX);
        }, { passive: false });

        scrubContainer.addEventListener('touchend', (e) => {
            if (!isScrubbing) return;
            e.stopPropagation();
            isScrubbing = false;
            scrubContainer.classList.remove('active');
            const touch = e.changedTouches[0];
            const { time } = getScrubPosition(touch.clientX);
            video.currentTime = time;
            showControls();
        });

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                wrapper.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                enterFullscreenIcon.style.display = 'none';
                exitFullscreenIcon.style.display = 'block';
            } else {
                enterFullscreenIcon.style.display = 'block';
                exitFullscreenIcon.style.display = 'none';
            }
        });

        fullscreenBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleFullscreen();
        });

        function closeAllPopups() {
            document.querySelectorAll('.menu-popup').forEach(p => p.classList.remove('open'));
        }

        qualityMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = qualityPopup.classList.contains('open');
            closeAllPopups();
            if (!isOpen) qualityPopup.classList.add('open');
        });

        speedMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = speedPopup.classList.contains('open');
            closeAllPopups();
            if (!isOpen) speedPopup.classList.add('open');
        });

        document.addEventListener('click', closeAllPopups);

        document.querySelectorAll('#speedPopup .menu-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                const speed = parseFloat(item.dataset.speed);
                video.playbackRate = speed;
                speedLabel.innerText = speed === 1 ? '1x' : `${speed}x`;
                document.querySelectorAll('#speedPopup .menu-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                closeAllPopups();
            });
        });

        document.addEventListener('keydown', (e) => {
            if (['input', 'textarea'].includes(document.activeElement.tagName.toLowerCase())) return;

            showControls();
            switch (e.key.toLowerCase()) {
                case ' ':
                case 'k':
                    e.preventDefault();
                    togglePlay();
                    break;
                case 'f':
                    e.preventDefault();
                    toggleFullscreen();
                    break;
                case 'm':
                    e.preventDefault();
                    volumeBtn.click();
                    break;
                case 'arrowleft':
                case 'j':
                    e.preventDefault();
                    rewindBtn.click();
                    break;
                case 'arrowright':
                case 'l':
                    e.preventDefault();
                    forwardBtn.click();
                    break;
                case 'arrowup':
                    e.preventDefault();
                    updateVolume(Math.min(1, video.volume + 0.1));
                    break;
                case 'arrowdown':
                    e.preventDefault();
                    updateVolume(Math.max(0, video.volume - 0.1));
                    break;
            }
        });

        function loadStream(streamUrl) {
            loader.style.display = 'flex';
            errorModal.style.display = 'none';
            video.style.display = 'block';

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            if (Hls.isSupported()) {
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90
                });
                
                hlsInstance.loadSource(streamUrl);
                hlsInstance.attachMedia(video);

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                    loader.style.display = 'none';
                    video.play().catch(() => {});
                    
                    qualityList.innerHTML = '<div class="menu-item active" data-level="-1">Auto (Optimal)</div>';
                    if (data.levels && data.levels.length > 0) {
                        data.levels.forEach((lvl, idx) => {
                            const label = lvl.name || `${lvl.height}p`;
                            const el = document.createElement('div');
                            el.className = 'menu-item';
                            el.dataset.level = idx;
                            el.innerText = `${label} HD`;
                            el.addEventListener('click', (e) => {
                                e.stopPropagation();
                                hlsInstance.currentLevel = idx;
                                document.querySelectorAll('#qualityList .menu-item').forEach(i => i.classList.remove('active'));
                                el.classList.add('active');
                                closeAllPopups();
                            });
                            qualityList.appendChild(el);
                        });
                    }
                });

                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hlsInstance.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hlsInstance.recoverMediaError();
                                break;
                            default:
                                hlsInstance.destroy();
                                loader.style.display = 'none';
                                errorModal.style.display = 'block';
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', () => {
                    loader.style.display = 'none';
                    video.play().catch(() => {});
                });
            } else {
                loader.style.display = 'none';
                errorModal.style.display = 'block';
            }
        }

        function playIframeEmbed(iframeUrl) {
            loader.style.display = 'none';
            video.style.display = 'none';
            document.querySelector('.bottom-bar').style.display = 'none';

            const existingIframe = wrapper.querySelector('iframe');
            if (existingIframe) existingIframe.remove();

            const iframe = document.createElement('iframe');
            iframe.src = iframeUrl;
            iframe.setAttribute('allowfullscreen', 'true');
            iframe.setAttribute('scrolling', 'no');
            iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-presentation');
            wrapper.appendChild(iframe);
        }

        async function initPlayer() {
            const urlParams = new URLSearchParams(window.location.search);
            let slug = urlParams.get('slug') || urlParams.get('id') || urlParams.get('v');
            let server = urlParams.get('server') || '';

            const pathParts = window.location.pathname.split('/').filter(Boolean);
            if (pathParts.length >= 2 && pathParts[0] === 'play' && pathParts[1] !== 'play.html') {
                slug = pathParts[1];
            }

            if (!slug) {
                loader.style.display = 'none';
                errorModalDesc.innerText = "Tidak ada judul film yang dipilih.";
                errorModal.style.display = 'block';
                return;
            }

            // 1. Tampilkan Judul Awal Langsung (0ms)
            const cleanTitle = slug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
            movieTitle.innerText = cleanTitle;
            document.title = `${cleanTitle} - Video Player`;

            // 2. Langsung Mulai Putar Video (Instant Startup - 0ms Delay)
            if (server.toLowerCase() === 'hydrax') {
                fetch(`/api/session/${encodeURIComponent(slug)}?server=hydrax`)
                    .then(res => res.json())
                    .then(sessionData => {
                        if (sessionData.success && sessionData.iframe) {
                            playIframeEmbed(sessionData.iframe);
                        }
                    })
                    .catch(() => {});
            } else {
                const streamUrl = `/stream/${encodeURIComponent(slug)}${server ? '?server=' + encodeURIComponent(server) : ''}`;
                loadStream(streamUrl);
            }

            // 3. Ambil Detail Film Asli di Background (Non-Blocking)
            fetch(`/api/detail?url=/${encodeURIComponent(slug)}`)
                .then(res => res.json())
                .then(detailData => {
                    if (detailData.success && detailData.data && detailData.data.title) {
                        movieTitle.innerText = detailData.data.title;
                        document.title = `${detailData.data.title}`;
                    }
                })
                .catch(() => {});
        }

        retryBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            window.location.reload();
        });

        initPlayer();
    </script>
</body>
</html>
